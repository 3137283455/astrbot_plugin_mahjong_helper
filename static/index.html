<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f5f7"><title>慧慧控制台</title><link rel="stylesheet" href="/admin/assets/style.css"><link rel="stylesheet" href="/admin/assets/operations.css"><script src="/admin/assets/app.js" defer></script><script src="/admin/assets/operations.js" defer></script></head><body>
<div id="login" class="login-layout" hidden><div class="login-story"><div class="logo large">慧</div><p class="eyebrow">HUIHUI CONSOLE</p><h1>每个功能，<br>都井井有条。</h1><p>慧慧机器人的管理空间。</p><div class="story-bottom"><span class="mini-dot"></span> 配置 · 数据 · 运行状态</div></div><main class="login-main"><form id="login-form" class="login-form"><div class="logo mobile-logo">慧</div><h2>登录慧慧控制台</h2><p class="muted">使用 AstrBot 面板的账号与密码</p><label>账号<input name="username" autocomplete="username" required maxlength="100" placeholder="管理员账号"></label><label>密码<div class="password-wrap"><input name="password" type="password" autocomplete="current-password" required maxlength="256" placeholder="输入密码"><button type="button" id="reveal" aria-label="显示密码">显示</button></div></label><label id="totp-label" hidden>动态验证码<input name="code" autocomplete="one-time-code" inputmode="numeric" maxlength="20" placeholder="身份验证器中的验证码"></label><p id="login-error" class="error-text" role="alert"></p><button type="submit" class="primary full" id="login-submit">登录</button><p class="login-note">仅限管理员访问</p></form></main></div>
<div id="shell" hidden><div id="nav-shade" class="nav-shade"></div><aside class="sidebar"><a class="brand" href="#plugins"><span class="logo">慧</span><span>慧慧控制台<small>你的机器人管理空间</small></span></a><p class="nav-label">工作空间</p><nav id="nav"></nav><div class="sidebar-bottom"><button class="account" data-go="account"><span class="avatar" id="avatar">管</span><span><strong id="username">管理员</strong><small>管理员</small></span><span class="chevron">›</span></button></div></aside><div class="workspace"><header class="topbar"><div class="heading"><button class="icon-button menu-button" id="menu-toggle" aria-label="打开导航"></button><div><h1 id="page-title">插件管理</h1><p id="page-subtitle">把每个功能，调整到恰到好处。</p></div></div><div class="top-actions"><span id="online-pill" class="status-pill"><i></i><span>连接中</span></span><button class="icon-button" id="refresh" aria-label="刷新当前页面"></button></div></header><main id="content" tabindex="-1"></main><nav class="bottom-nav" id="bottom-nav"></nav></div></div>

</body></html>
